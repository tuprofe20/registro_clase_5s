<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clase - Colegio Lobachevsky</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jsPDF y AutoTable para exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Ocultar flechas de incremento/decremento en inputs numéricos */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }

        /* Clases de colores para el Select de Asistencia */
        .select-asistio { background-color: #dcfce7; color: #166534; } /* Verde */
        .select-tarde { background-color: #fef08a; color: #854d0e; }   /* Amarillo */
        .select-falto { background-color: #fee2e2; color: #991b1b; }   /* Rojo */
        .select-retiro { background-color: #ffedd5; color: #9a3412; }  /* Naranja */
        .select-default { background-color: #f3f4f6; color: #374151; } /* Gris por defecto */
        
        /* Clases de colores para el Select de Conducta */
        .select-cond-a { background-color: #dcfce7; color: #166534; } /* Verde (A) */
        .select-cond-b { background-color: #fef08a; color: #854d0e; } /* Amarillo (B) */
        .select-cond-c { background-color: #fee2e2; color: #991b1b; } /* Rojo (C) */
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        
        <!-- Encabezado Institucional -->
        <div class="bg-[#0f172a] text-white p-6 border-b-4 border-blue-600 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">Registro de Evaluación y Asistencia</h1>
                <h2 class="text-lg md:text-xl font-semibold text-blue-200 mt-1">Colegio Lobachevsky</h2>
                <div class="mt-2 text-sm text-gray-300 flex flex-col sm:flex-row sm:gap-6 items-start sm:items-center">
                    <p><span>Grado:</span> 5° Año de Secundaria</p>
                    <p><span>Profesor:</span> Danny Torres</p>
                    <div class="flex items-center gap-2 mt-2 sm:mt-0">
                        <label for="input-curso" class="font-semibold text-white">Curso:</label>
                        <input type="text" id="input-curso" placeholder="Ej. Física" class="px-2 py-1 rounded text-gray-900 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 w-40">
                    </div>
                </div>
            </div>
            
            <!-- Botones de Acción -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto mt-4 md:mt-0">
                <button onclick="marcarTodosAsistio()" class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-3 rounded shadow transition-colors w-full md:w-auto text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    Todos: Asistió
                </button>
                <button onclick="marcarTodosConductaA()" class="flex items-center justify-center gap-2 bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-3 rounded shadow transition-colors w-full md:w-auto text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    Todos: Cond. A
                </button>
                <button onclick="exportarPDF()" class="flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-3 rounded shadow transition-colors w-full md:w-auto text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                    Descargar PDF
                </button>
            </div>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="overflow-x-auto p-4">
            <table class="w-full text-sm text-left border-collapse min-w-[1000px]" id="registro-tabla">
                <thead class="text-xs text-gray-700 bg-gray-100 uppercase font-semibold">
                    <!-- Fila de Grupos -->
                    <tr class="bg-[#1e293b] text-white">
                        <th rowspan="2" class="border border-slate-600 p-3 text-center w-10">N°</th>
                        <th rowspan="2" class="border border-slate-600 p-3 w-64">Apellidos y Nombres</th>
                        <th rowspan="2" class="border border-slate-600 p-3 text-center w-28 bg-slate-700">Asistencia</th>
                        <th rowspan="2" class="border border-slate-600 p-3 text-center w-24 bg-teal-900">Conducta</th>
                        <th colspan="3" class="border border-slate-600 p-2 text-center bg-blue-900/50">Participación (0-100 pts)</th>
                        <th colspan="3" class="border border-slate-600 p-2 text-center bg-indigo-900/50">Práctica Calificada</th>
                    </tr>
                    <!-- Fila de Subcolumnas -->
                    <tr class="bg-slate-200 text-slate-800">
                        <th class="border border-slate-300 p-2 text-center w-16">P1</th>
                        <th class="border border-slate-300 p-2 text-center w-16">P2</th>
                        <th class="border border-slate-400 p-2 text-center bg-blue-100 font-bold text-blue-900 w-20">Total</th>
                        <th class="border border-slate-300 p-2 text-center w-20">PC1</th>
                        <th class="border border-slate-300 p-2 text-center w-20">PC2</th>
                        <th class="border border-slate-400 p-2 text-center bg-indigo-100 font-bold text-indigo-900 w-24">Promedio</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <!-- Filas generadas por JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        // 1. Datos de los alumnos
        const alumnos = [
            "Bances Aniceto Gonzalo Fabian", "Barrios Muro Ismael", "Bedoya Peña Luhana Nicol",
            "Chumacero Villegas Adrian Stephano", "Coello Borda Jean Paul", "Cuzcano Mendoza Julio Rodrigo",
            "Florindez Salazar Santiago Julian", "Gallo Panduro Jorge Ricardo", "Huashuayo Sanchez Mateo Maximo",
            "Jara Diaz Christian Patrick", "Laura Alencastre Daniel Alessandro", "Mera Chuquihuanga Adrian Antonio",
            "Monzon Jalck Massimo Gabriel", "Puelles Alarcon Italo Ricardo", "Quiñonez Bermejo Gabriela Abril",
            "Rabanal Davila Rodrigo Fernando", "Rojas Garcia Shelsi Yesli", "Romero Ferrari Umberto Fernando",
            "Sanchez Alvarez Sibley Ayelen", "Solano Herrera Judith Nazaret Luciana", "Uchofen Fretel Alessandro Emanuel",
            "Ullon Ocampo Camila Valeria", "Valverde Pachas Joao Anderson", "Vergaray Guerrero Carolina Yazmin",
            "Virhuez Tarazona Valentina"
        ];

        // 2. Generar la tabla al cargar
        const tbody = document.getElementById('cuerpo-tabla');

        alumnos.forEach((alumno, index) => {
            const i = index + 1;
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-200 hover:bg-gray-50 transition-colors";
            
            tr.innerHTML = `
                <td class="border border-gray-300 p-2 text-center font-semibold text-gray-600">${i}</td>
                <td class="border border-gray-300 p-2 text-gray-800 text-xs font-medium whitespace-nowrap">${alumno}</td>
                
                <!-- Asistencia -->
                <td class="border border-gray-300 p-1">
                    <select class="w-full h-full p-1 border-0 rounded text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none select-default text-center cursor-pointer asistencia-select" data-row="${i}">
                        <option value="-" class="bg-white text-gray-800">- Marcar -</option>
                        <option value="Asistió" class="bg-white text-green-700">Asistió</option>
                        <option value="Tarde" class="bg-white text-yellow-700">Tarde</option>
                        <option value="Faltó" class="bg-white text-red-700">Faltó</option>
                        <option value="Retiró" class="bg-white text-orange-700">Se retiró</option>
                    </select>
                </td>

                <!-- Conducta -->
                <td class="border border-gray-300 p-1">
                    <select class="w-full h-full p-1 border-0 rounded text-xs font-semibold focus:ring-2 focus:ring-teal-500 outline-none select-default text-center cursor-pointer conducta-select" data-row="${i}">
                        <option value="-" class="bg-white text-gray-800">-</option>
                        <option value="A" class="bg-white text-green-700">A</option>
                        <option value="B" class="bg-white text-yellow-700">B</option>
                        <option value="C" class="bg-white text-red-700">C</option>
                    </select>
                </td>
                
                <!-- Participación -->
                <td class="border border-gray-300 p-1"><input type="number" min="0" max="100" class="w-full text-center p-1 border border-gray-200 rounded input-part bg-white focus:ring-1 focus:ring-blue-400" data-row="${i}"></td>
                <td class="border border-gray-300 p-1"><input type="number" min="0" max="100" class="w-full text-center p-1 border border-gray-200 rounded input-part bg-white focus:ring-1 focus:ring-blue-400" data-row="${i}"></td>
                <td class="border border-gray-300 p-2 text-center font-bold text-blue-900 bg-blue-50 text-sm" id="total-part-${i}">0</td>
                
                <!-- Práctica -->
                <td class="border border-gray-300 p-1"><input type="number" min="0" max="20" class="w-full text-center p-1 border border-gray-200 rounded input-prac bg-white focus:ring-1 focus:ring-indigo-400" data-row="${i}"></td>
                <td class="border border-gray-300 p-1"><input type="number" min="0" max="20" class="w-full text-center p-1 border border-gray-200 rounded input-prac bg-white focus:ring-1 focus:ring-indigo-400" data-row="${i}"></td>
                <td class="border border-gray-300 p-2 text-center font-bold text-indigo-900 bg-indigo-50 text-sm" id="prom-prac-${i}">0</td>
            `;
            tbody.appendChild(tr);
        });

        // 3. Lógica de Cálculos y Colores (Delegación de eventos)
        document.addEventListener('input', function(e) {
            // Suma de Participación
            if(e.target.classList.contains('input-part')) {
                let rowId = e.target.getAttribute('data-row');
                let inputsPart = document.querySelectorAll('.input-part[data-row="' + rowId + '"]');
                let suma = 0;
                inputsPart.forEach(input => {
                    let val = parseFloat(input.value);
                    if(!isNaN(val)) suma += val;
                });
                document.getElementById('total-part-' + rowId).innerText = suma;
            }
            
            // Promedio de Práctica Inteligente
            if(e.target.classList.contains('input-prac')) {
                let rowId = e.target.getAttribute('data-row');
                let inputsPrac = document.querySelectorAll('.input-prac[data-row="' + rowId + '"]');
                let suma = 0;
                let notasIngresadas = 0;
                
                inputsPrac.forEach(input => {
                    // Si el input no está vacío, procesamos el valor
                    if(input.value.trim() !== "") {
                        let val = parseFloat(input.value);
                        if(!isNaN(val)) {
                            suma += val;
                            notasIngresadas++;
                        }
                    }
                });
                
                let promedio = 0;
                if(notasIngresadas === 1) {
                    promedio = suma; // Muestra la nota individual si hay solo 1
                } else if (notasIngresadas === 2) {
                    promedio = suma / 2; // Muestra el promedio si hay 2 notas
                }
                
                document.getElementById('prom-prac-' + rowId).innerText = notasIngresadas > 0 ? promedio.toFixed(1).replace('.0', '') : "0";
            }
        });

        // Cambiar colores del Select de Asistencia y Conducta
        document.addEventListener('change', function(e) {
            if(e.target.classList.contains('asistencia-select')) {
                const val = e.target.value;
                e.target.classList.remove('select-default', 'select-asistio', 'select-tarde', 'select-falto', 'select-retiro');
                
                if(val === 'Asistió') e.target.classList.add('select-asistio');
                else if(val === 'Tarde') e.target.classList.add('select-tarde');
                else if(val === 'Faltó') e.target.classList.add('select-falto');
                else if(val === 'Retiró') e.target.classList.add('select-retiro');
                else e.target.classList.add('select-default');
            }
            
            if(e.target.classList.contains('conducta-select')) {
                const val = e.target.value;
                e.target.classList.remove('select-default', 'select-cond-a', 'select-cond-b', 'select-cond-c');
                
                if(val === 'A') e.target.classList.add('select-cond-a');
                else if(val === 'B') e.target.classList.add('select-cond-b');
                else if(val === 'C') e.target.classList.add('select-cond-c');
                else e.target.classList.add('select-default');
            }
        });

        // Marcar a todos como "Asistió"
        function marcarTodosAsistio() {
            const selects = document.querySelectorAll('.asistencia-select');
            selects.forEach(select => {
                select.value = 'Asistió';
                select.dispatchEvent(new Event('change', { bubbles: true }));
            });
        }

        // Marcar a todos como "A" en Conducta
        function marcarTodosConductaA() {
            const selects = document.querySelectorAll('.conducta-select');
            selects.forEach(select => {
                select.value = 'A';
                select.dispatchEvent(new Event('change', { bubbles: true }));
            });
        }

        // 4. Función para formatear fecha (Formato DD-MM-YY)
        function obtenerFechaFormateada() {
            const ahora = new Date();
            const dia = ahora.getDate().toString().padStart(2, '0');
            const mes = (ahora.getMonth() + 1).toString().padStart(2, '0');
            const anio = ahora.getFullYear().toString().slice(-2);
            return dia + "-" + mes + "-" + anio;
        }

        // 5. Extracción de Datos de la Tabla para Exportar
        function obtenerDatosTabla() {
            const filas = document.querySelectorAll('#cuerpo-tabla tr');
            const datos = [];
            
            filas.forEach((fila, index) => {
                const i = index + 1;
                const nombre = alumnos[index];
                
                const asistencia = fila.querySelector('.asistencia-select').value;
                const conducta = fila.querySelector('.conducta-select').value;
                
                const p1 = fila.querySelectorAll('.input-part')[0].value || "0";
                const p2 = fila.querySelectorAll('.input-part')[1].value || "0";
                const totalPart = document.getElementById('total-part-' + i).innerText;
                
                const pc1 = fila.querySelectorAll('.input-prac')[0].value || "0";
                const pc2 = fila.querySelectorAll('.input-prac')[1].value || "0";
                const promPrac = document.getElementById('prom-prac-' + i).innerText;

                datos.push([
                    i.toString(), nombre, asistencia, conducta,
                    p1, p2, totalPart, 
                    pc1, pc2, promPrac
                ]);
            });
            return datos;
        }

        // 6. Exportar PDF Oficial
        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape'); 
            
            const fechaHoraTexto = new Date().toLocaleString('es-PE');
            const fechaArchivo = obtenerFechaFormateada();
            
            let cursoInput = document.getElementById('input-curso').value.trim();
            let nombreCursoParaArchivo = cursoInput ? cursoInput.replace(/\s+/g, '_') : "General";
            let nombreCursoParaPDF = cursoInput || "No especificado";
            
            // --- Diseño del Encabezado del PDF ---
            doc.setFillColor(15, 23, 42); 
            doc.rect(0, 0, 300, 42, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.text("COLEGIO LOBACHEVSKY", 14, 15);
            
            doc.setFontSize(14);
            doc.setFont("helvetica", "normal");
            doc.text("Registro Oficial de Clase - Evaluación y Asistencia", 14, 25);
            
            doc.setFontSize(10);
            doc.setTextColor(200, 200, 255);
            doc.text("Grado: 5° Año de Secundaria", 200, 15);
            doc.text("Curso: " + nombreCursoParaPDF, 200, 22);
            doc.text("Profesor: Danny Torres", 200, 29);
            doc.text("Fecha de reporte: " + fechaHoraTexto, 200, 36);

            // --- Estructura de Datos para AutoTable ---
            const cabecerasPrincipal = [
                [
                    { content: 'N°', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
                    { content: 'Apellidos y Nombres', rowSpan: 2, styles: { valign: 'middle' } },
                    { content: 'Asistencia', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
                    { content: 'Cond.', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
                    { content: 'Participación en Clase', colSpan: 3, styles: { halign: 'center', fillColor: [30, 58, 138] } },
                    { content: 'Prácticas Calificadas', colSpan: 3, styles: { halign: 'center', fillColor: [49, 46, 129] } }
                ],
                [
                    { content: 'P1', styles: { halign: 'center' } }, { content: 'P2', styles: { halign: 'center' } }, 
                    { content: 'Total', styles: { halign: 'center', fillColor: [219, 234, 254], textColor: [30, 58, 138], fontStyle: 'bold' } },
                    { content: 'PC1', styles: { halign: 'center' } }, { content: 'PC2', styles: { halign: 'center' } },
                    { content: 'Prom', styles: { halign: 'center', fillColor: [224, 231, 255], textColor: [49, 46, 129], fontStyle: 'bold' } }
                ]
            ];

            const cuerpoDatos = obtenerDatosTabla();

            doc.autoTable({
                head: cabecerasPrincipal,
                body: cuerpoDatos,
                startY: 48,
                theme: 'grid',
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [71, 85, 105], textColor: [255,255,255] },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 10 },
                    1: { cellWidth: 70 },
                    2: { halign: 'center', cellWidth: 22 },
                    3: { halign: 'center', cellWidth: 15 }, // Conducta
                    6: { halign: 'center', fontStyle: 'bold', fillColor: [239, 246, 255] },
                    9: { halign: 'center', fontStyle: 'bold', fillColor: [238, 242, 255] }
                },
                didParseCell: function(data) {
                    // Colorear Asistencia
                    if (data.section === 'body' && data.column.index === 2) {
                        const val = data.cell.raw;
                        if (val === 'Asistió') { data.cell.styles.textColor = [22, 101, 52]; data.cell.styles.fontStyle = 'bold'; }
                        else if (val === 'Tarde') { data.cell.styles.textColor = [133, 77, 14]; data.cell.styles.fontStyle = 'bold'; }
                        else if (val === 'Faltó') { data.cell.styles.textColor = [153, 27, 27]; data.cell.styles.fontStyle = 'bold'; }
                        else if (val === 'Retiró') { data.cell.styles.textColor = [154, 52, 18]; data.cell.styles.fontStyle = 'bold'; }
                    }
                    // Colorear Conducta
                    if (data.section === 'body' && data.column.index === 3) {
                        const val = data.cell.raw;
                        if (val === 'A') { data.cell.styles.textColor = [22, 101, 52]; data.cell.styles.fontStyle = 'bold'; }
                        else if (val === 'B') { data.cell.styles.textColor = [133, 77, 14]; data.cell.styles.fontStyle = 'bold'; }
                        else if (val === 'C') { data.cell.styles.textColor = [153, 27, 27]; data.cell.styles.fontStyle = 'bold'; }
                    }
                    
                    // Centrar números
                    if (data.section === 'body' && data.column.index > 3) {
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(100);
                doc.text("Documento generado automáticamente - Página " + i + " de " + totalPages, 14, doc.internal.pageSize.getHeight() - 10);
            }

            doc.save("registro_de_clase_" + nombreCursoParaArchivo + "_" + fechaArchivo + ".pdf");
        }
    </script>
</body>
</html>
